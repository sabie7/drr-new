     1	# ─────────────────────────────────────────────────────────────────────────────
     2	# hi-master — full stack orchestration (Phase 8)
     3	#
     4	#   app    : the Node.js chat server (multi-stage Dockerfile, port 3000)
     5	#   mongo  : MongoDB 7 — durable source of truth for the storage layer
     6	#   redis  : OPTIONAL — only needed for the @socket.io/redis-adapter when
     7	#            running multiple app replicas behind a load balancer.
     8	#   coturn : WebRTC TURN relay (from Phase 4) for voice behind symmetric NAT.
     9	#
    10	# Default deploy (Mongo + coturn, single app instance):
    11	#     docker compose up -d
    12	#
    13	# Horizontal scaling with Redis adapter (start the redis service + N replicas):
    14	#     docker compose --profile redis up -d --scale app=2
    15	#     (then set REDIS_URL and TURN_URL in the app environment below)
    16	#
    17	# Health: the app image HEALTHCHECK polls GET /api/health, which performs a
    18	# real `ping` against MongoDB and returns 503 when Mongo is unreachable.
    19	# ─────────────────────────────────────────────────────────────────────────────
    20	name: hi-master
    21	
    22	services:
    23	  mongo:
    24	    image: mongo:7
    25	    container_name: hi-master-mongo
    26	    restart: unless-stopped
    27	    volumes:
    28	      - mongo-data:/data/db
    29	    healthcheck:
    30	      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    31	      interval: 10s
    32	      timeout: 5s
    33	      retries: 5
    34	      start_period: 10s
    35	    ports:
    36	      - "127.0.0.1:27017:27017"
    37	
    38	  # Optional — required only for the socket.io redis-adapter (multi-instance).
    39	  redis:
    40	    image: redis:7-alpine
    41	    container_name: hi-master-redis
    42	    restart: unless-stopped
    43	    profiles: ["redis"]
    44	    command: ["redis-server", "--appendonly", "yes"]
    45	    volumes:
    46	      - redis-data:/data
    47	    healthcheck:
    48	      test: ["CMD", "redis-cli", "ping"]
    49	      interval: 10s
    50	      timeout: 5s
    51	      retries: 5
    52	
    53	  # Free self-hosted TURN relay (Phase 4). `network_mode: host` binds a wide
    54	  # UDP relay range — Linux only; see docker-compose.voice.yml for the bridge
    55	  # networking alternative on Docker Desktop/macOS.
    56	  coturn:
    57	    image: coturn/coturn:4.6
    58	    container_name: hi-master-turn
    59	    restart: unless-stopped
    60	    network_mode: host
    61	    environment:
    62	      TURN_PORT: "3478"
    63	      TURN_USERNAME: "${TURN_USER:-chat}"
    64	      TURN_PASSWORD: "${TURN_PASS:-change-me-strong-turn-password}"
    65	      TURN_REALM: "${TURN_REALM:-turn.example.com}"
    66	      TURN_USE_AUTH_SECRET: "false"
    67	      TURN_NO_AUTH: "false"
    68	      TURN_MIN_PORT: "49152"
    69	      TURN_MAX_PORT: "65535"
    70	      TURN_VERBOSE: "true"
    71	
    72	  app:
    73	    build: .
    74	    container_name: hi-master-app
    75	    restart: unless-stopped
    76	    depends_on:
    77	      mongo:
    78	        condition: service_healthy
    79	    environment:
    80	      NODE_ENV: production
    81	      PORT: "3000"
    82	      MONGO_URI: "mongodb://mongo:27017/njmoman"
    83	      # ⚠ Replace with strong, persistent values in production (.env):
    84	      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-secret}"
    85	      ADMIN_USER: "${ADMIN_USER:-admin}"
    86	      ADMIN_PASS: "${ADMIN_PASS:-require-ADMIN_PASS}"
    87	      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    88	      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-52428800}"
    89	      # Voice (must match the coturn service credentials):
    90	      TURN_URL: "${TURN_URL:-turn:127.0.0.1:3478}"
    91	      TURN_USER: "${TURN_USER:-chat}"
    92	      TURN_PASS: "${TURN_PASS:-change-me-strong-turn-password}"
    93	      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}"
    94	      MAX_VOICE_SPEAKERS: "${MAX_VOICE_SPEAKERS:-4}"
    95	      # Backups
    96	      BACKUP_KEEP: "${BACKUP_KEEP:-20}"
    97	      BACKUP_INTERVAL_MS: "${BACKUP_INTERVAL_MS:-21600000}"
    98	      # Structured logging (Phase 8): "json" or "text"
    99	      LOG_LEVEL: "${LOG_LEVEL:-info}"
   100	      LOG_FORMAT: "${LOG_FORMAT:-json}"
   101	      LOG_META: "${LOG_META:-{\"service\":\"hi-master\"}}"
   102	      # Socket.io redis-adapter (only when the redis profile is enabled)
   103	      REDIS_URL: "${REDIS_URL:-}"
   104	    ports:
   105	      - "3000:3000"
   106	    volumes:
   107	      - app-uploads:/app/assets/uploads
   108	      - app-data:/app/data
   109	      - app-backups:/app/backups
   110	
   111	volumes:
   112	  mongo-data:
   113	  redis-data:
   114	  app-uploads:
   115	  app-data:
   116	  app-backups:
   117	